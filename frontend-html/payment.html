<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment - Prajal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="screen">
  <div class="topbar"><span class="back" onclick="history.back()">&#8592;</span><h1>Payment</h1></div>
  <div class="content" id="content">Loading...</div>
</div>

<script src="js/api.js"></script>
<script>
  Auth.requireAuth();
  const bookingId = new URLSearchParams(location.search).get('bookingId');
  let booking, selectedMethod = 'transfer_bca';

  const methods = [
    { id: 'transfer_bca', label: 'Bank BCA', group: 'Transfer' },
    { id: 'transfer_mandiri', label: 'Bank Mandiri', group: 'Transfer' },
    { id: 'gopay', label: 'GoPay', group: 'Instant Payment' },
    { id: 'ovo', label: 'OVO', group: 'Instant Payment' }
  ];

  function render() {
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="row-between"><span class="muted">Motorbike</span><b>${booking.bike_name || ''}</b></div>
        <div class="summary-row"><span>Motorbike (${booking.days} days)</span><span>${formatMoney(booking.bike_subtotal)}</span></div>
        <div class="summary-row"><span>Delivery Fee</span><span>${formatMoney(booking.delivery_fee)}</span></div>
        <div class="summary-row total"><span>Total payment</span><span>${formatMoney(booking.total)}</span></div>
      </div>

      <h3>Choose a payment method</h3>
      <div id="methodList"></div>

      <div id="err" class="error-box"></div>
      <button class="btn" id="payBtn">Pay Now</button>
    `;
    const list = document.getElementById('methodList');
    list.innerHTML = methods.map(m => `
      <div class="payment-option ${m.id === selectedMethod ? 'selected' : ''}" data-id="${m.id}">
        <span>${m.label}</span><span class="muted">${m.group}</span>
      </div>
    `).join('');
    list.querySelectorAll('.payment-option').forEach(el => {
      el.addEventListener('click', () => {
        selectedMethod = el.dataset.id;
        render();
      });
    });
    document.getElementById('payBtn').addEventListener('click', pay);
  }

  async function pay() {
    clearError('err');
    const btn = document.getElementById('payBtn');
    btn.disabled = true; btn.textContent = 'Processing...';
    try {
      const payment = await api('/payments', {
        method: 'POST', auth: true,
        body: { booking_id: bookingId, method: selectedMethod }
      });
      const confirmed = confirm(
        `Transfer ${formatMoney(booking.total)} to ${selectedMethod.toUpperCase()} account 8064093234, then click OK to confirm payment (mock).`
      );
      if (!confirmed) { btn.disabled = false; btn.textContent = 'Pay Now'; return; }
      await api(`/payments/${payment.id}/confirm`, { method: 'POST', auth: true });
      location.href = `order-confirmation.html?bookingId=${bookingId}`;
    } catch (err) {
      showError('err', err.message);
      btn.disabled = false; btn.textContent = 'Pay Now';
    }
  }

  async function load() {
    booking = await api(`/bookings/${bookingId}`, { auth: true });
    render();
  }
  load();
</script>
</body>
</html>
