<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify OTP - Prajal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="screen">
  <div class="topbar"><span class="back" onclick="history.back()">&#8592;</span><h1>Enter the OTP Code</h1></div>
  <div class="content">
    <p class="muted">The OTP code has been sent via SMS to the number <b id="phoneLabel"></b></p>
    <div id="err" class="error-box"></div>
    <p id="debugHint" class="muted" style="display:none;background:#eef7f1;padding:10px;border-radius:8px;"></p>

    <div class="otp-inputs">
      <input maxlength="1" inputmode="numeric" />
      <input maxlength="1" inputmode="numeric" />
      <input maxlength="1" inputmode="numeric" />
      <input maxlength="1" inputmode="numeric" />
    </div>

    <p class="muted" style="text-align:center;">
      Haven't received the code yet?
      <a class="link" href="#" id="resendLink">Request new code</a>
      <span id="timer">(00:25)</span>
    </p>

    <button class="btn" id="submitBtn">Submit</button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const phone = sessionStorage.getItem('otp_phone');
  const purpose = sessionStorage.getItem('otp_purpose') || 'register';
  const debugOtp = sessionStorage.getItem('debug_otp');
  if (!phone) window.location.href = 'register.html';
  document.getElementById('phoneLabel').textContent = phone;
  if (debugOtp) {
    const hint = document.getElementById('debugHint');
    hint.style.display = 'block';
    hint.textContent = `Dev mode: your OTP is ${debugOtp} (SMS is not wired up yet)`;
  }

  const inputs = document.querySelectorAll('.otp-inputs input');
  inputs.forEach((input, idx) => {
    input.addEventListener('input', () => {
      if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
    });
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    clearError('err');
    const code = Array.from(inputs).map(i => i.value).join('');
    if (code.length !== 4) return showError('err', 'Enter the full 4-digit code.');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Verifying...';
    try {
      const data = await api('/auth/verify-otp', { method: 'POST', body: { phone, code } });
      Auth.setToken(data.token);
      Auth.setUser(data.user);
      sessionStorage.removeItem('otp_phone');
      sessionStorage.removeItem('debug_otp');
      window.location.href = 'home.html';
    } catch (err) {
      showError('err', err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Submit';
    }
  });

  document.getElementById('resendLink').addEventListener('click', async (e) => {
    e.preventDefault();
    clearError('err');
    try {
      const data = await api('/auth/resend-otp', { method: 'POST', body: { phone, purpose } });
      if (data.debug_otp) {
        const hint = document.getElementById('debugHint');
        hint.style.display = 'block';
        hint.textContent = `Dev mode: your new OTP is ${data.debug_otp}`;
      }
    } catch (err) {
      showError('err', err.message);
    }
  });
</script>
</body>
</html>
