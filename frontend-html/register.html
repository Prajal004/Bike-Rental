<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register - Prajal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="screen">
  <div class="topbar"><span class="back" onclick="history.back()">&#8592;</span><h1>Create account</h1></div>
  <div class="content">
    <p class="muted">Create your account and enjoy renting a motorbike in prajal easily</p>
    <div id="err" class="error-box"></div>

    <form id="regForm">
      <div class="field">
        <label>Name</label>
        <input id="name" placeholder="Prajal Shah" required />
      </div>
      <div class="field">
        <label>Phone</label>
        <input id="phone" placeholder="98XXXXXXXX" required />
      </div>
      <div class="field">
        <label>Email (optional)</label>
        <input id="email" type="email" placeholder="name@gmail.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="At least 6 characters" required minlength="6" />
      </div>
      <button class="btn" type="submit" id="regBtn">Create account</button>
    </form>

    <p style="text-align:center;margin-top:20px;" class="muted">
      Already have an account? <a class="link" href="login.html">Login</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError('err');
    const btn = document.getElementById('regBtn');
    btn.disabled = true; btn.textContent = 'Creating...';
    try {
      const data = await api('/auth/register', {
        method: 'POST',
        body: {
          name: document.getElementById('name').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          email: document.getElementById('email').value.trim() || undefined,
          password: document.getElementById('password').value
        }
      });
      sessionStorage.setItem('otp_phone', data.phone);
      sessionStorage.setItem('otp_purpose', 'register');
      if (data.debug_otp) sessionStorage.setItem('debug_otp', data.debug_otp);
      window.location.href = 'otp.html';
    } catch (err) {
      showError('err', err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
