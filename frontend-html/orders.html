<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders - Prajal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="screen">
  <div class="topbar"><h1>My Orders</h1></div>
  <div class="content" id="content">Loading...</div>
  <div class="bottom-nav">
    <a href="home.html">🏠<br>Home</a>
    <a href="orders.html" class="active">🧾<br>Orders</a>
    <a href="#" id="logoutLink">🚪<br>Logout</a>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  Auth.requireAuth();
  document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); Auth.logout(); });

  async function load() {
    try {
      const orders = await api('/bookings', { auth: true });
      if (!orders.length) {
        document.getElementById('content').innerHTML = '<p class="muted">You have no orders yet.</p>';
        return;
      }
      document.getElementById('content').innerHTML = orders.map(o => `
        <div class="card" onclick="location.href='order-detail.html?bookingId=${o.id}'" style="cursor:pointer;">
          <div class="row-between">
            <b>${o.bike_name}</b>
            <span class="status-badge status-${o.status}">${o.status.replace('_',' ')}</span>
          </div>
          <p class="muted">Order #${o.order_no} • ${o.start_date} → ${o.end_date}</p>
          <div class="row-between"><span>Total</span><b>${formatMoney(o.total)}</b></div>
        </div>
      `).join('');
    } catch (err) {
      document.getElementById('content').innerHTML = `<p class="error-box show">${err.message}</p>`;
    }
  }
  load();
</script>
</body>
</html>
