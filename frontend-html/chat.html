<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat - Prajal</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<div class="screen">
  <div class="topbar"><span class="back" onclick="history.back()">&#8592;</span><h1>Prajal Motor</h1></div>
  <div class="chat-wrap">
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input-row">
      <input id="msgInput" placeholder="Write a message..." />
      <button id="sendBtn">&#10148;</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  Auth.requireAuth();
  const bookingId = new URLSearchParams(location.search).get('bookingId');
  const me = Auth.getUser();
  const messagesEl = document.getElementById('messages');

  function renderMessage(m) {
    const mine = m.sender_type === 'user' && m.sender_id === me.id;
    const div = document.createElement('div');
    div.className = `bubble ${mine ? 'mine' : 'theirs'}`;
    div.textContent = m.message;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function loadHistory() {
    try {
      const history = await api(`/chat/${bookingId}`, { auth: true });
      history.forEach(renderMessage);
    } catch (err) {
      messagesEl.innerHTML = `<p class="error-box show">${err.message}</p>`;
    }
  }

  const socket = io('http://localhost:4000');
  socket.emit('chat:join', bookingId);
  socket.on('chat:message', (m) => renderMessage(m));

  document.getElementById('sendBtn').addEventListener('click', send);
  document.getElementById('msgInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  async function send() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      await api(`/chat/${bookingId}`, { method: 'POST', auth: true, body: { message: text } });
    } catch (err) {
      alert(err.message);
    }
  }

  loadHistory();
</script>
</body>
</html>
