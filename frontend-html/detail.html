<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Detail - Prajal</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="screen">
  <div class="topbar"><span class="back" onclick="history.back()">&#8592;</span><h1>Detail</h1></div>
  <div class="detail-image" id="detailImg"></div>
  <div class="content" id="content">Loading...</div>
</div>

<script src="js/api.js"></script>
<script>
  Auth.requireAuth();
  const id = new URLSearchParams(location.search).get('id');

  async function load() {
    try {
      const bike = await api(`/bikes/${id}`);
      document.getElementById('detailImg').textContent = bike.name;
      document.getElementById('detailImg').style.display = 'flex';
      document.getElementById('detailImg').style.alignItems = 'center';
      document.getElementById('detailImg').style.justifyContent = 'center';
      document.getElementById('detailImg').style.color = '#5c6b62';
      document.getElementById('detailImg').style.background = 'linear-gradient(135deg,#dfe7e0,#c7d6cb)';

      document.getElementById('content').innerHTML = `
        <div class="row-between">
          <h2 style="margin:0;">${bike.name}</h2>
          <span>♡</span>
        </div>
        <p class="muted">⭐ ${bike.rating} &nbsp;•&nbsp; ${bike.station}</p>
        <div style="margin:10px 0;">
          ${bike.features.map(f => `<span class="feature-pill">✔ ${f.replace('_',' ')}</span>`).join('')}
        </div>
        <div class="card">
          <div class="row-between">
            <span class="price" style="font-size:20px;font-weight:800;color:var(--green);">${formatMoney(bike.price_per_day)}</span>
            <span class="muted">/ day</span>
          </div>
        </div>
        <button class="btn" onclick="location.href='location.html?bikeId=${bike.id}'">Order now</button>
      `;
    } catch (err) {
      document.getElementById('content').innerHTML = `<p class="error-box show">${err.message}</p>`;
    }
  }
  load();
</script>
</body>
</html>
