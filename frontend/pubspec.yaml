name: bike_rental_app
description: "Nepal Motorcycle Rental App with Payment, Referral, SOS & Nepali Language"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.0
  http: ^1.1.0
  geolocator: ^13.0.1
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/